name: Build ServerDock

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Desktop platform to build
        type: choice
        options: [windows, linux, macos, all]
        default: windows

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            bundles: nsis,msi
          - platform: linux
            os: ubuntu-22.04
            bundles: deb,appimage
          - platform: macos
            os: macos-latest
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        if: inputs.platform == matrix.platform || inputs.platform == 'all'
      - uses: actions/setup-node@v4
        if: inputs.platform == matrix.platform || inputs.platform == 'all'
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        if: inputs.platform == matrix.platform || inputs.platform == 'all'
      - name: Install Linux dependencies
        if: matrix.platform == 'linux' && (inputs.platform == 'linux' || inputs.platform == 'all')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev openssh-client xterm
      - name: Install and test
        if: inputs.platform == matrix.platform || inputs.platform == 'all'
        shell: bash
        run: |
          npm ci
          npm test
          cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build desktop packages (no upstream updater signing)
        if: inputs.platform == matrix.platform || inputs.platform == 'all'
        shell: bash
        run: npm run tauri -- build --bundles '${{ matrix.bundles }}'
      - uses: actions/upload-artifact@v4
        if: inputs.platform == matrix.platform || inputs.platform == 'all'
        with:
          name: ServerDock-${{ matrix.platform }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
